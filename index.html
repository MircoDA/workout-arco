<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Archery Pro Argon | Workout & Telemetria Tiro</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --amber: #f59e0b;
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 130px;
    }

    header {
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(8px);
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header h1 span {
      background: linear-gradient(135deg, #10b981, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .nav-tabs {
      display: flex;
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      max-width: 680px;
      margin: 0 auto;
      position: sticky;
      top: 63px;
      z-index: 25;
    }

    .nav-tab {
      flex: 1;
      padding: 13px 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .nav-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(16, 185, 129, 0.06);
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    .section-view {
      display: none;
    }

    .section-view.active {
      display: block;
    }

    /* Banner Riscaldamento */
    .warmup-banner {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: #fde68a;
      line-height: 1.4;
    }

    .day-selector {
      display: flex;
      background: #111827;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }

    .day-btn {
      flex: 1;
      padding: 10px 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-btn.active {
      background: var(--accent);
      color: #064e3b;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .exercise-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .target-badge {
      font-size: 0.7rem;
      background: #334155;
      color: #cbd5e1;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
      margin-left: 8px;
    }

    .wrist-shield {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      color: var(--amber);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .guide-toggle-btn {
      background: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .guide-box {
      display: none;
      background: #0b1324;
      border-left: 3px solid #38bdf8;
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 0.84rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .guide-box.show {
      display: block;
    }

    .guide-box strong {
      color: #fff;
    }

    .exercise-img-wrap {
      margin-bottom: 12px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #090e17;
    }

    .exercise-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    .sets-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .set-row {
      display: grid;
      grid-template-columns: 52px 1fr 1fr 56px;
      gap: 8px;
      align-items: center;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .set-label {
      color: var(--text-muted);
      font-weight: 600;
    }

    .input-field {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: #fff;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      width: 100%;
    }

    .check-btn {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 8px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .check-btn.completed {
      background: var(--accent);
      color: #064e3b;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* SEZIONE TIRO CON L'ARCO */
    .tiro-header-card {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .field-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .field-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
      min-width: 65px;
    }

    .date-input {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      flex: 1;
    }

    .counter-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .counter-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .counter-number {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1.1;
    }

    .quick-arrow-btns {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .quick-btn {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .quick-btn:active {
      background: var(--accent);
      color: #064e3b;
    }

    .score-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 12px;
    }

    .summary-item .num {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent);
    }

    .summary-item .lbl {
      font-size: 0.62rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Analisi Rosata (Tendenza direzionale) */
    .rosata-bar {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.76rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .rosata-pill {
      background: #1e293b;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .volee-divider {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #38bdf8;
      margin: 12px 0 4px 4px;
      display: flex;
      justify-content: space-between;
    }

    .arrows-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .arrow-card {
      display: grid;
      grid-template-columns: 34px 86px 1fr 30px;
      gap: 6px;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 9px 10px;
    }

    .arrow-num {
      font-weight: 800;
      color: var(--text-muted);
      font-size: 0.82rem;
      text-align: center;
    }

    .score-select {
      background: #0f172a;
      color: #fff;
      border: 1px solid var(--card-border);
      padding: 7px 4px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
    }

    .dir-cluster {
      display: flex;
      gap: 4px;
      justify-content: center;
    }

    .dir-btn {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .dir-btn.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
    }

    .del-arrow-btn {
      background: transparent;
      color: #64748b;
      border: none;
      font-size: 1rem;
      cursor: pointer;
    }

    .tiro-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .add-arrow-btn {
      background: #111827;
      border: 2px dashed var(--accent);
      color: var(--accent);
      padding: 13px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .save-history-btn {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .export-excel-btn {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Storico Sessioni */
    .history-section {
      margin-top: 28px;
      border-top: 1px solid var(--card-border);
      padding-top: 18px;
    }

    .history-title {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-card {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }

    /* Timer Fluttuante */
    .timer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--card-border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 680px;
      margin: 0 auto;
      z-index: 50;
    }

    .timer-display {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .timer-ring-container {
      position: relative;
      width: 44px;
      height: 44px;
    }

    .timer-ring {
      transform: rotate(-90deg);
    }

    .timer-seconds {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.9rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .timer-controls {
      display: flex;
      gap: 5px;
    }

    .time-chip {
      background: #1e293b;
      color: #cbd5e1;
